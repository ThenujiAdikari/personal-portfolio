<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Thenuji Adikari | Web Developer</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: #0f172a;
            color: #ffffff;
        }

        /* =========================
           NAVIGATION
        ========================= */

        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background-color: #0f172a;
            border-bottom: 1px solid #1e293b;
            z-index: 1000;
        }

        .navbar {
            max-width: 1200px;
            height: 80px;
            margin: auto;
            padding: 0 30px;

            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            color: #ffffff;
            font-size: 23px;
            font-weight: bold;
            text-decoration: none;
        }

        .logo span {
            color: #38bdf8;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 35px;
            list-style: none;
        }

        .nav-links a {
            color: #cbd5e1;
            font-size: 15px;
            text-decoration: none;
            transition: 0.3s;
        }

        .nav-links a:hover,
        .nav-links .active {
            color: #38bdf8;
        }

        /* =========================
           DOWNLOAD CV BUTTON
        ========================= */

        .cv-btn {
            background-color: #38bdf8;
            color: #0f172a;
            padding: 11px 20px;
            border-radius: 7px;
            text-decoration: none;
            font-weight: bold;
            transition: 0.3s;
        }

        .cv-btn:hover {
            background-color: #7dd3fc;
            transform: translateY(-2px);
        }

        /* =========================
           MOBILE MENU BUTTON
        ========================= */

        .menu-btn {
            display: none;
            background: none;
            border: none;
            color: #ffffff;
            font-size: 28px;
            cursor: pointer;
        }

        /* =========================
           HOME SECTION
        ========================= */

        .hero {
            max-width: 1200px;
            min-height: 100vh;
            margin: auto;
            padding: 120px 30px 60px;

            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 60px;
        }

        /* LEFT SIDE */

        .hero-content {
            flex: 1;
        }

        .intro {
            color: #38bdf8;
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 12px;
        }

        .hero h1 {
            font-size: 58px;
            line-height: 1.1;
            margin-bottom: 12px;
        }

        .hero h2 {
            color: #94a3b8;
            font-size: 30px;
            margin-bottom: 25px;
        }

        .hero-description {
            max-width: 600px;
            color: #cbd5e1;
            font-size: 17px;
            line-height: 1.8;
            margin-bottom: 35px;
        }

        /* =========================
           BUTTONS
        ========================= */

        .hero-buttons {
            display: flex;
            gap: 15px;
        }

        .primary-btn,
        .secondary-btn {
            display: inline-block;
            padding: 13px 25px;
            border-radius: 7px;
            text-decoration: none;
            font-weight: bold;
            transition: 0.3s;
        }

        .primary-btn {
            background-color: #38bdf8;
            color: #0f172a;
        }

        .primary-btn:hover {
            background-color: #7dd3fc;
            transform: translateY(-2px);
        }

        .secondary-btn {
            color: #38bdf8;
            border: 2px solid #38bdf8;
        }

        .secondary-btn:hover {
            background-color: #38bdf8;
            color: #0f172a;
            transform: translateY(-2px);
        }

        /* =========================
           PROFILE IMAGE
        ========================= */

        .hero-image {
            flex: 1;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .hero-image img {
            width: 370px;
            height: 370px;
            object-fit: cover;

            border-radius: 50%;
            border: 5px solid #38bdf8;

            box-shadow: 0 0 40px rgba(56, 189, 248, 0.30);

            transition: 0.3s;
        }

        .hero-image img:hover {
            transform: scale(1.03);

            box-shadow: 0 0 55px rgba(56, 189, 248, 0.45);
        }

        /* =========================
           TABLET / MOBILE
        ========================= */

        @media (max-width: 850px) {

            .nav-links {
                display: none;
                position: absolute;
                top: 80px;
                left: 0;
                width: 100%;
                background-color: #0f172a;
                padding: 25px;
                flex-direction: column;
                gap: 20px;
                border-top: 1px solid #1e293b;
            }

            .nav-links.show {
                display: flex;
            }

            .cv-btn {
                display: none;
            }

            .menu-btn {
                display: block;
            }

            .hero {
                flex-direction: column-reverse;
                text-align: center;
                padding-top: 130px;
            }

            .hero-content {
                display: flex;
                flex-direction: column;
                align-items: center;
            }

            .hero h1 {
                font-size: 42px;
            }

            .hero h2 {
                font-size: 25px;
            }

            .hero-image img {
                width: 260px;
                height: 260px;
            }

            .hero-buttons {
                justify-content: center;
            }
        }

        /* =========================
           SMALL PHONES
        ========================= */

        @media (max-width: 480px) {

            .navbar {
                padding: 0 20px;
            }

            .logo {
                font-size: 20px;
            }

            .hero {
                padding-left: 20px;
                padding-right: 20px;
            }

            .hero h1 {
                font-size: 36px;
            }

            .hero h2 {
                font-size: 22px;
            }

            .hero-description {
                font-size: 15px;
            }

            .hero-buttons {
                flex-direction: column;
                width: 100%;
            }

            .primary-btn,
            .secondary-btn {
                width: 100%;
                text-align: center;
            }

            .hero-image img {
                width: 220px;
                height: 220px;
            }
        }
    </style>

</head>

<body>

    <!-- =========================
         NAVIGATION
    ========================= -->

    <header>

        <nav class="navbar">

            <a href="index.html" class="logo">
                Thenuji <span>Adikari</span>
            </a>

            <ul class="nav-links" id="navLinks">

                <li>
                    <a href="index.html" class="active">Home</a>
                </li>

                <li>
                    <a href="about.html">About</a>
                </li>

                <li>
                    <a href="skills.html">Skills</a>
                </li>

                <li>
                    <a href="projects.html">Projects</a>
                </li>

                <li>
                    <a href="contact.html">Contact</a>
                </li>

            </ul>

            <a href="documents/cv.pdf"
               class="cv-btn"
               download>
                Download CV
            </a>

            <button class="menu-btn"
                    id="menuBtn"
                    type="button">
                ☰
            </button>

        </nav>

    </header>


    <!-- =========================
         HOME
    ========================= -->

    <main>

        <section class="hero">

            <!-- LEFT SIDE -->

            <div class="hero-content">

                <p class="intro">
                    Hello, I'm
                </p>

                <h1>
                    Thenuji Adikari
                </h1>

                <h2>
                    Web Developer
                </h2>

                <p class="hero-description">
                    I create modern, responsive and user-friendly
                    websites with a focus on clean design and
                    great user experiences.
                </p>

                <div class="hero-buttons">

                    <a href="projects.html"
                       class="primary-btn">
                        View My Work
                    </a>

                    <a href="contact.html"
                       class="secondary-btn">
                        Contact Me
                    </a>

                </div>

            </div>


            <!-- RIGHT SIDE -->

            <div class="hero-image">

                <img src="images/profile.jpg"
                     alt="Thenuji Adikari">

            </div>

        </section>

    </main>


    <!-- MOBILE MENU JAVASCRIPT -->

    <script>

        const menuBtn = document.getElementById("menuBtn");
        const navLinks = document.getElementById("navLinks");

        menuBtn.addEventListener("click", function () {
            navLinks.classList.toggle("show");
        });

    </script>

</body>

</html>
